name: Offline sample and model regression tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Run fictional sample (no live-data pipeline)
        run: python -m src.sample_run --output-dir "${{ runner.temp }}/financial-sector-sample"
      - name: Ensure tracked files were not modified
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-sample-${{ matrix.os }}
          path: ${{ runner.temp }}/financial-sector-sample/
          if-no-files-found: error
